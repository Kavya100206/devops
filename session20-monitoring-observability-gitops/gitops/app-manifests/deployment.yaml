apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-managed-app
  namespace: production
  labels:
    app: gitops-managed-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitops-managed-app
  template:
    metadata:
      labels:
        app: gitops-managed-app
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-managed-service
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: gitops-managed-app
  ports:
    - port: 80
      targetPort: 80
